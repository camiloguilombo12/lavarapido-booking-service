spring:
  application:
    name: booking-service
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=LavaRapido;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  config:
    import: "optional:file:../lavarapido-infra/.env"

server:
  port: ${PORT:3003}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
