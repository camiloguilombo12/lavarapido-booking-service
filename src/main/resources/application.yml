spring:
  # respuestas de error sin mensajes internos ni trazas (en Spring Boot 4 reemplaza a server.error.*)
  web:
    error:
      include-message: never
      include-stacktrace: never
  application:
    name: booking-service
  # En local arranca con dev, salvo que se diga otra cosa con SPRING_PROFILES_ACTIVE.
  profiles:
    default: dev
  # Los secretos van en lavarapido-infra/.env, que no se sube al repositorio. Si este servicio
  # tiene su propio .env, ese gana. Las variables de entorno mandan sobre los dos.
  config:
    import:
      - optional:file:../lavarapido-infra/.env[.properties]
      - optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=LavaRapido;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # las tablas las crea Liquibase, Hibernate solo revisa que el mapeo cuadre
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        use_nationalized_character_data: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Cada servicio tiene su propia tabla de changelog, porque los seis migran la misma base.
    database-change-log-table: DATABASECHANGELOG_BOOKING
    database-change-log-lock-table: DATABASECHANGELOGLOCK_BOOKING

  # RabbitMQ (ADR-004): solo se usa con MESSAGING_ENABLED=true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${PORT:3003}
  shutdown: graceful

security:
  jwt:
    # El mismo secreto, emisor y audiencia que usa security-service. Este servicio solo revisa
    # el token, no lo emite.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:lavarapido-security-service}
    audience: ${JWT_AUDIENCE:lavarapido-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}

app:
  # llave compartida para /internal/** (X-Internal-Key): operations-service lee reservas sin usuario
  # detrás (asignación automática, RF-008). Vacía: esas rutas responden 401
  internal:
    api-key: ${INTERNAL_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}
  messaging:
    # false: los eventos de reserva solo van al log
    enabled: ${MESSAGING_ENABLED:false}
  customer-service:
    # de aqui se valida que el vehiculo sea del cliente (REST, ADR-004)
    base-url: ${CUSTOMER_SERVICE_URL:http://localhost:3002/api/v1}
    timeout: ${CUSTOMER_SERVICE_TIMEOUT:3s}
  booking:
    # zona horaria del lavadero: el horario y las fechas que ve el cliente estan en esta hora
    zone: ${BOOKING_ZONE:America/Bogota}
    # cada cuanto se ofrece una hora de inicio
    slot-minutes: ${BOOKING_SLOT_MINUTES:30}
    # hasta cuantos dias hacia adelante se puede reservar
    max-days-ahead: ${BOOKING_MAX_DAYS_AHEAD:60}
    # cuantas horas alternativas se ofrecen si la pedida esta ocupada (RF-006)
    alternatives: 5
    # margen despues de la hora de fin: una confirmada que nunca se inicio y no tuvo operario la
    # cierra operations-service como NO_SHOW (POST /internal/v1/bookings/{id}/no-show) pasado este
    # tiempo. Ya no hay tarea programada aqui (B-07): las reservas nacen confirmadas.
    expiry-grace-minutes: ${BOOKING_EXPIRY_GRACE_MINUTES:60}
    # B: cuantas reservas activas en efectivo puede tener un cliente a la vez (409 CASH_BOOKING_LIMIT)
    cash-active-limit: ${BOOKING_CASH_ACTIVE_LIMIT:1}
    # D: cuanto tiene el cliente para subir el comprobante de una reserva DIGITAL (o hasta la hora de
    # inicio, si es mas pronto); despues PaymentDeadlineJob la cancela con PAYMENT_TIMEOUT
    payment-window: ${BOOKING_PAYMENT_WINDOW:30m}

# Swagger apagado por defecto; application-dev.yml lo prende
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    rabbit:
      enabled: ${MESSAGING_ENABLED:false}
  info:
    env:
      enabled: true

info:
  service: booking-service

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
